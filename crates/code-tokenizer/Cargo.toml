[package]
name = "code-tokenizer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
