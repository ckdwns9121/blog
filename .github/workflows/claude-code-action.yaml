name: Cluade Code Review

on:
  pull_request:
    types: [opened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1 # 리뷰를 위해 코드를 가져옵니다.

      - name: Delete Previous Claude Reviews
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e  # Continue on error
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          echo "🔍 이전 Claude 리뷰 검색 중..."

          # claude[bot]이 작성한 코멘트만 삭제 (일반 사용자 코멘트 보호)
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read comment_id; do
                if [ -n "$comment_id" ]; then
                  echo "🗑️  PR 코멘트 삭제: $comment_id"
                  gh api -X DELETE "repos/$REPO/issues/comments/$comment_id" 2>/dev/null || echo "⚠️  삭제 실패 (무시)"
                fi
              done

          # 인라인 리뷰 코멘트 처리
          # 봇이 작성한 스레드 중 해결되지 않은 것만 삭제
          OWNER=${REPO%/*}
          NAME=${REPO#*/}

          # GitHub GraphQL API를 사용하여 리뷰 스레드 조회
          gh api graphql -F owner="$OWNER" -F name="$NAME" -F number=$PR_NUMBER -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(last: 100) {
                    nodes {
                      isResolved
                      comments(first: 1) {
                        nodes {
                          databaseId
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | select(.comments.nodes[0].author.login == "claude[bot]") | .comments.nodes[0].databaseId' \
            | while read comment_id; do
                if [ -n "$comment_id" ]; then
                  echo "🗑️  인라인 코멘트 삭제: $comment_id"
                  gh api -X DELETE "repos/$REPO/pulls/comments/$comment_id" 2>/dev/null || echo "⚠️  삭제 실패 (무시)"
                fi
              done
          echo "✅ 이전 리뷰 삭제 완료"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR(#${{ github.event.pull_request.number }})에 대해 코드 리뷰를 수행해주세요.

            리뷰 결과는 GitHub PR 코멘트로 남겨주세요.
            모든 코멘트와 리뷰 내용은 반드시 **한국어**로 작성해주세요.

          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'
