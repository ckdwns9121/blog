name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Delete Previous Claude Reviews
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e  # Continue on error
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          echo "🔍 이전 Claude 리뷰 검색 중..."

          # claude[bot]이 작성한 코멘트만 삭제 (일반 사용자 코멘트 보호)
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read comment_id; do
                if [ -n "$comment_id" ]; then
                  echo "🗑️  PR 코멘트 삭제: $comment_id"
                  gh api -X DELETE "repos/$REPO/issues/comments/$comment_id" 2>/dev/null || echo "⚠️  삭제 실패 (무시)"
                fi
              done

          # 인라인 리뷰 코멘트 처리
          # 봇이 작성한 스레드 중 해결되지 않은 것만 삭제
          OWNER=${REPO%/*}
          NAME=${REPO#*/}

          # GitHub GraphQL API를 사용하여 리뷰 스레드 조회
          gh api graphql -F owner="$OWNER" -F name="$NAME" -F number=$PR_NUMBER -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(last: 100) {
                    nodes {
                      isResolved
                      comments(first: 1) {
                        nodes {
                          databaseId
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | select(.comments.nodes[0].author.login == "claude[bot]") | .comments.nodes[0].databaseId' \
            | while read comment_id; do
                if [ -n "$comment_id" ]; then
                  echo "🗑️  인라인 코멘트 삭제: $comment_id"
                  gh api -X DELETE "repos/$REPO/pulls/comments/$comment_id" 2>/dev/null || echo "⚠️  삭제 실패 (무시)"
                fi
              done
          echo "✅ 이전 리뷰 삭제 완료"

      - name: Prepare MCP Config
        env:
          REVIEW_MCP_CONFIG_JSON: ${{ secrets.REVIEW_MCP_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${REVIEW_MCP_CONFIG_JSON:-}" ]; then
            echo '{"mcpServers":{}}' > /tmp/review-mcp-config.json
          else
            printf '%s' "$REVIEW_MCP_CONFIG_JSON" > /tmp/review-mcp-config.json
          fi

      - name: Build Context Bundle
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // ""')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login // ""')

          CHANGED_FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename' | sed 's/^/- /')
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="- 변경 파일 없음"
          fi

          TICKET_KEY=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)

          {
            echo "prompt<<EOF"
            echo "REPO: $REPO"
            echo "PR NUMBER: $PR_NUMBER"
            echo "AUTHOR: $PR_AUTHOR"
            echo ""
            echo "## PR 배경"
            echo "제목: $PR_TITLE"
            echo "본문:"
            echo "$PR_BODY"
            echo ""
            echo "## 외부 컨텍스트 조회 대상"
            echo "- Jira 티켓 키: ${TICKET_KEY:-없음}"
            echo "- Jira/Slack 상세 맥락은 MCP 도구로 조회하세요."
            echo ""
            echo "## 변경 파일"
            echo "$CHANGED_FILES"
            echo ""
            echo "## 리뷰 지시"
            echo "1) 변경 파일 기반으로 코드 리뷰를 수행하세요."
            echo "2) Jira MCP와 Slack MCP를 사용해 PR 배경 맥락을 수집하세요."
            echo "3) 필요한 경우 GitHub MCP/gh 검색으로 다른 레포 영향도를 점검하세요."
            echo "4) 결과는 반드시 한국어로, 근거 중심으로 작성하세요."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: ${{ steps.context.outputs.prompt }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --system-prompt "당신은 회사 코드리뷰 에이전트입니다. 항상 한국어로 답변하고, 반드시 근거 파일/맥락을 함께 제시하세요."
            --mcp-config /tmp/review-mcp-config.json
            --allowedTools "mcp__jira__*,mcp__slack__*,mcp__github_*,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh search code:*)"
