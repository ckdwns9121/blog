name: Review Bot Hello

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read # 코드를 읽어오기 위해 추가

jobs:
  hello-reply:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@review-bot')
    runs-on: ubuntu-latest
    steps:
      # 👇 [중요] 이 단계가 없어서 에러가 난 겁니다. 코드를 체크아웃 받아야 .git 폴더가 생깁니다.
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reply to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $PR_NUMBER --body "안녕하세요 리뷰봇입니다. 🤖 (git 에러 해결 완료!)"
