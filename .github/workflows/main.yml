name: Autonomous PR Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@review-bot') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run agent
        uses: ckdwns9121/shared-actions/actions/autonomous-pr-review@v2.0.1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.REVIEW_BOT_TOKEN }}
          repo: ${{ github.repository }}
          pr_number: ${{ github.event.issue.number }}
