name: Claude Review Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Mention Context Bundle
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          PR_NUMBER=$(jq -r '.issue.number // .pull_request.number // empty' "$GITHUB_EVENT_PATH")
          EVENT_NAME="${{ github.event_name }}"

          COMMENT_BODY=""
          if jq -e '.comment.body' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            COMMENT_BODY=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          elif jq -e '.review.body' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            COMMENT_BODY=$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")
          elif jq -e '.issue.body' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            COMMENT_BODY=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")
          fi

          TICKET_KEY=$(printf '%s\n' "$COMMENT_BODY" | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)

          JIRA_CONTEXT="Jira 컨텍스트 없음"
          if [ -n "${TICKET_KEY:-}" ] && [ -n "${JIRA_BASE_URL:-}" ] && [ -n "${JIRA_EMAIL:-}" ] && [ -n "${JIRA_API_TOKEN:-}" ]; then
            JIRA_URL="$JIRA_BASE_URL/rest/api/3/issue/$TICKET_KEY"
            JIRA_RES=$(curl -sS -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' "$JIRA_URL" || true)
            JIRA_SUMMARY=$(echo "$JIRA_RES" | jq -r '.fields.summary // ""')
            JIRA_STATUS=$(echo "$JIRA_RES" | jq -r '.fields.status.name // ""')
            if [ -n "$JIRA_SUMMARY" ] || [ -n "$JIRA_STATUS" ]; then
              JIRA_CONTEXT="티켓: ${TICKET_KEY}\n요약: ${JIRA_SUMMARY}\n상태: ${JIRA_STATUS}"
            fi
          fi

          SLACK_CONTEXT="Slack 컨텍스트 없음"
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ] && [ -n "${TICKET_KEY:-}" ]; then
            SLACK_RES=$(curl -sS -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              "https://slack.com/api/conversations.history?channel=$SLACK_CHANNEL_ID&limit=50" || true)
            SLACK_CONTEXT=$(echo "$SLACK_RES" | jq -r --arg key "$TICKET_KEY" '.messages[]? | select(.text | contains($key)) | .text' | head -n 10 | sed 's/^/- /' || true)
          fi

          if [ -z "${SLACK_CONTEXT:-}" ]; then
            SLACK_CONTEXT="Slack 관련 메시지 없음"
          fi

          {
            echo "prompt<<EOF"
            echo "REPO: $REPO"
            echo "EVENT: $EVENT_NAME"
            echo "PR NUMBER: ${PR_NUMBER:-N/A}"
            echo ""
            echo "## 사용자 요청"
            echo "$COMMENT_BODY"
            echo ""
            echo "## Jira 컨텍스트"
            printf '%b\n' "$JIRA_CONTEXT"
            echo ""
            echo "## Slack 컨텍스트"
            printf '%b\n' "$SLACK_CONTEXT"
            echo ""
            echo "## 지시"
            echo "요청에 답변하거나 코드리뷰를 수행하세요."
            echo "필요한 경우 gh API/검색으로 근거를 보강하세요."
            echo "모든 답변은 한국어로 작성하세요."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ steps.context.outputs.prompt }}
          claude_args: >-
            --system-prompt "당신은 회사 코드리뷰/기술질문 응답 에이전트입니다. 답변은 한국어로 작성하고 반드시 근거 기반으로 작성하세요."
            --allowedTools "Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh search code:*)"
