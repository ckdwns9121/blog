name: Claude Review Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare MCP Config
        env:
          REVIEW_MCP_CONFIG_JSON: ${{ secrets.REVIEW_MCP_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${REVIEW_MCP_CONFIG_JSON:-}" ]; then
            echo '{"mcpServers":{}}' > /tmp/review-mcp-config.json
          else
            printf '%s' "$REVIEW_MCP_CONFIG_JSON" > /tmp/review-mcp-config.json
          fi

      - name: Build Mention Context Bundle
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          PR_NUMBER=$(jq -r '.issue.number // .pull_request.number // empty' "$GITHUB_EVENT_PATH")
          EVENT_NAME="${{ github.event_name }}"

          COMMENT_BODY=""
          if jq -e '.comment.body' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            COMMENT_BODY=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          elif jq -e '.review.body' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            COMMENT_BODY=$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")
          elif jq -e '.issue.body' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            COMMENT_BODY=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")
          fi

          TICKET_KEY=$(printf '%s\n' "$COMMENT_BODY" | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)

          {
            echo "prompt<<EOF"
            echo "REPO: $REPO"
            echo "EVENT: $EVENT_NAME"
            echo "PR NUMBER: ${PR_NUMBER:-N/A}"
            echo ""
            echo "## 사용자 요청"
            echo "$COMMENT_BODY"
            echo ""
            echo "## 외부 컨텍스트 조회 대상"
            echo "- Jira 티켓 키: ${TICKET_KEY:-없음}"
            echo "- Jira/Slack 상세 맥락은 MCP 도구로 조회하세요."
            echo ""
            echo "## 지시"
            echo "요청에 답변하거나 코드리뷰를 수행하세요."
            echo "필요한 경우 Jira MCP/Slack MCP/GitHub MCP를 사용해 근거를 보강하세요."
            echo "모든 답변은 한국어로 작성하세요."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ steps.context.outputs.prompt }}
          claude_args: >-
            --system-prompt "당신은 회사 코드리뷰/기술질문 응답 에이전트입니다. 답변은 한국어로 작성하고 반드시 근거 기반으로 작성하세요."
            --mcp-config /tmp/review-mcp-config.json
            --allowedTools "mcp__jira__*,mcp__slack__*,mcp__github_*,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh search code:*)"
