name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 잡은 git 에 쓰지 않는다. 의존성 설치나 테스트가 토큰을 읽지 못하게 한다.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Rebuild and test the real Wasm module
        run: |
          node scripts/buildWasm.mjs
          cargo test --locked --manifest-path crates/code-tokenizer/Cargo.toml
          node --test scripts/tokenizerWasm.check.mjs
      - name: Check generated artifacts are current
        run: git diff --exit-code -- src/features/notion/wasm/generated public/wasm
